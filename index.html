<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/vue@2.7.8/dist/vue.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <title>MyAcademia</title>
</head>
<body>
  <div id="webstore">
    <!-- Navigation Bar -->
    <nav>
      <div class="logo"><i class="fas fa-graduation-cap"></i> MyAcademia</div>
      <div class="nav-links">
        <a href="#" @click="change('home')" :class="{active: currentPage === 'home'}">
          <i class="fas fa-home"></i> Home
        </a>
        <a href="#" @click="change('courses')" :class="{active: currentPage === 'courses'}">
          <i class="fas fa-book"></i> Courses
        </a>
        <a href="#" @click="change('profile')" :class="{active: currentPage === 'profile'}">
          <i class="fas fa-user"></i> Profile
        </a>
      </div>
    </nav>

    <!-- Home Page -->
    <div v-if="currentPage === 'home'">
      <h1>Welcome to MyAcademia</h1>
      <p>Empowering your education journey.</p>
    </div>

    <!-- Sign Up Page -->
    <div v-if="currentPage === 'signUp'">
      <h1>Sign Up</h1>
      <p>Create a new account.</p>
      <div class="card shadow p-4" style="max-width: 400px; margin: auto;">
        <form @submit.prevent="signUp">
          <label for="username">Username:</label>
          <input type="text" id="username" v-model="name" required>

          <label for="email">Email:</label>
          <input type="email" id="email" v-model="email" required>

          <label for="password">Password:</label>
          <input type="password" id="password" v-model="password" required>

          <button type="submit">Sign Up</button>
        </form>
      </div>
    </div>

    <!-- Courses Page -->
    <div v-if="currentPage === 'courses'">
      <h1>Courses</h1>
      <p>Here are your courses.</p>
      <div class="course-card" v-for="course in courses" :key="course.id">
        <img :src="course.image" alt="Course Image">
        <h2>{{ course.title }}</h2>
        <p>{{ course.description }}</p>
        <button @click="addItemToCart(course)">
          <i class="fa-solid fa-cart-plus"></i> Add To Cart
        </button>
      </div>
    </div>

    <!-- Profile Page -->
    <div v-if="currentPage === 'profile'">
      <h1>Your Profile</h1>
      <p>Manage your profile here.</p>
    </div>
  </div>

  <script>
    let webstore = new Vue({
      el: '#webstore',
      data: {
        currentPage: 'signUp', // Set start page
        courses: [
          { id: 1, title: "Web Development", description: "Learn HTML, CSS, JS", image: "assets/scienceCourse.jpg" },
          { id: 2, title: "Data Science", description: "Intro to Python & ML", image: "assets/historyCourse.jpg" },
          { id: 3, title: "AI Basics", description: "Neural Networks & More", image: "assets/computerScienceCourse.jpg" }
        ],
        cart: [],
        name: '',
        email: '',
        password: ''
      },
      methods: {
        change(page) {
          this.currentPage = page;
        },
        signUp() {
          if (!this.name || !this.email || !this.password) {
            alert('Please fill in all fields.');
            return;
          }
          alert(`Welcome aboard, ${this.name}!`);
          this.currentPage = 'home';
        },
        addItemToCart(course) {
          this.cart.push(course.id);
          alert(`${course.title} has been added to your cart.`);
        }
      }
    });
  </script>
</body>
</html>
